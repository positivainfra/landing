<link rel="stylesheet" href="/new/chrome.css">
<!-- Google Ads (gtag.js) · Consent Mode v2 con TODO DENEGADO por defecto y sin
     banner: no se escribe ni se lee ninguna cookie en el navegador del visitante
     (coherente con /privacidad/). Google recibe pings anónimos sin identificadores
     y modela las conversiones. NO cambiar estos 'denied' ni añadir un banner que
     los actualice sin revisar antes la política de privacidad. -->
<script>
document.documentElement.classList.add('js');
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('consent', 'default', {
  ad_storage: 'denied',
  ad_user_data: 'denied',
  ad_personalization: 'denied',
  analytics_storage: 'denied',
  wait_for_update: 0
});
gtag('set', 'ads_data_redaction', true);
gtag('set', 'url_passthrough', false);
gtag('js', new Date());
gtag('config', 'AW-617896664');

/* Conversión de Google Ads: «registro» (clientes potenciales).
   Se dispara al pinchar cualquier enlace a app.positiva.studio/registro (los de
   login apuntan a la raíz de la app y quedan fuera).
   Sin bloquear la navegación: transport beacon sobrevive al cambio de página. */
function gtag_report_conversion(url) {
  var callback = function () {
    if (typeof(url) != 'undefined') { window.location = url; }
  };
  gtag('event', 'conversion', {
    'send_to': 'AW-617896664/J1C6CLaa9e8cENi10aYC',
    'event_callback': callback
  });
  return false;
}
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href^="https://app.positiva.studio/registro"]');
  if (!a || a.classList.contains('nav-login') || a.hasAttribute('data-no-conv')) return;
  try {
    gtag('event', 'conversion', {
      'send_to': 'AW-617896664/J1C6CLaa9e8cENi10aYC',
      'transport_type': 'beacon'
    });
  } catch (_) {}
}, { passive: true });
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-617896664"></script>
